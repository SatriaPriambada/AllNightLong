name: Build MSI Installer

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyinstaller pandas

      - name: Build .exe with PyInstaller
        run: |
          pyinstaller --windowed --name hello_app hello_app.py

      - name: Install WiX Toolset
        run: |
          choco install wixtoolset --yes
        shell: powershell

      - name: Build MSI
        run: |
          candle wix_msi.wxs
          light hello.wixobj -o HelloAppInstaller.msi

      - name: Upload MSI Installer
        uses: actions/upload-artifact@v4
        with:
          name: HelloAppInstaller
          path: HelloAppInstaller.msi
