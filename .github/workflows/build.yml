name: Build MSI Installer

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyinstaller pandas

      - name: Build .exe with PyInstaller
        run: |
          pyinstaller --windowed --name hello_app hello_app.py
      - name: Check for PyInstaller output
        run: |
          echo "Listing dist folder:"
          dir dist
          echo "Listing dist/hello_app folder:"
          dir dist\hello_app
      - name: Install WiX Toolset
        run: |
          choco install wixtoolset --yes
        shell: powershell

      - name: Build MSI
        run: |
          echo "Running candle..."
          candle hello.wxs || (echo "Candle failed" && dir && exit 1)

          echo "Checking for output .wixobj..."
          dir

          echo "Running light..."

          candle wix_msi.wxs
          light hello.wixobj -o HelloAppInstaller.msi

      - name: Upload MSI Installer
        uses: actions/upload-artifact@v4
        with:
          name: HelloAppInstaller
          path: HelloAppInstaller.msi
